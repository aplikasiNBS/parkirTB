<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Parkir Telaga Biru</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f2f5; color: #333; }
    .container { max-width: 650px; margin: 0 auto; padding: 12px; }
    .hidden { display: none !important; }
    .header { display: flex; justify-content: space-between; align-items: center; background: #1a73e8; color: white; padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; }
    .header h1 { font-size: 1.3rem; }
    .btn { border: none; border-radius: 8px; padding: 12px 16px; font-size: 0.95rem; font-weight: bold; cursor: pointer; background: #e0e0e0; color: #333; transition: 0.2s; }
    .btn.primary { background: #1a73e8; color: white; }
    .btn.danger { background: #d32f2f; color: white; }
    .btn.success { background: #2e7d32; color: white; }
    .btn.warning { background: #f57c00; color: white; }
    .btn.small { padding: 6px 10px; font-size: 0.8rem; border-radius: 6px; }
    .btn:active { opacity: 0.8; }
    .card { background: white; border-radius: 12px; padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
    .keluar-card { border: 2px solid #f57c00; background: #fff8f0; }
    .flex-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .flex-col { display: flex; flex-direction: column; gap: 10px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; }
    input:focus, select:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,0.15); }
    label { font-weight: 600; margin-bottom: 4px; font-size: 0.85rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    img.thumbnail { width: 55px; height: 55px; object-fit: cover; border-radius: 8px; cursor: pointer; }
    img.preview { max-width: 100%; max-height: 250px; border-radius: 8px; margin-top: 8px; }
    .foto-besar { width: 100%; max-height: 300px; object-fit: contain; border-radius: 8px; }
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -14px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid #eee; white-space: nowrap; }
    th { background: #f5f5f5; position: sticky; top: 0; z-index: 1; }
    .autocomplete-wrap { position: relative; }
    .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #ccc; border-top: none; max-height: 150px; overflow-y: auto; z-index: 10; border-radius: 0 0 8px 8px; }
    .suggestions div { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
    .suggestions div:hover { background: #e8f0fe; }
    .login-box { max-width: 350px; margin: 30px auto; }
    .ringkasan { background: #e8f5e9; padding: 12px; border-radius: 8px; margin: 10px 0; }
    .ringkasan b { font-size: 1.1rem; }
    @media (max-width: 420px) {
      .grid-2 { grid-template-columns: 1fr; }
      .btn { padding: 10px 14px; font-size: 0.9rem; }
      th, td { font-size: 0.75rem; padding: 6px 4px; }
    }
  </style>
</head>
<body>
  <div id="app" class="container">
    <!-- Login -->
    <div id="loginSection" class="card login-box">
      <h2 style="text-align:center; margin-bottom:14px;">🔐 Parkir TB - Login</h2>
      <div style="margin-bottom:16px;">
        <label>Password Petugas</label>
        <input type="password" id="passwordPetugas" placeholder="Password petugas" autocomplete="off">
        <button class="btn primary" style="width:100%; margin-top:8px;" onclick="loginPetugas()">Masuk Petugas</button>
        <p style="color:red; text-align:center; margin-top:6px;" id="loginError"></p>
      </div>
      <hr style="margin:16px 0;">
      <div>
        <label>Password Admin</label>
        <input type="password" id="passwordAdminInput" placeholder="Password admin" autocomplete="off">
        <button class="btn danger" style="width:100%; margin-top:8px;" onclick="loginAdmin()">Masuk Admin</button>
        <p style="color:red; text-align:center; margin-top:6px;" id="adminLoginError"></p>
      </div>
      <p style="text-align:center; font-size:0.78rem; margin-top:12px;">Telaga Biru Lempong5</p>
    </div>

    <!-- Halaman Petugas -->
    <div id="petugasSection" class="hidden">
      <div class="header">
        <h1>🚗 Parkir TB</h1>
        <button class="btn small" onclick="logout()">↩️ Logout</button>
      </div>

      <!-- Kendaraan Masuk -->
      <div class="card">
        <h3>➕ Kendaraan Masuk</h3>
        <div class="grid-2" style="margin:10px 0;">
          <button id="btnMotor" class="btn" onclick="pilihJenis('motor')">🏍️ Motor (2rb)</button>
          <button id="btnMobil" class="btn" onclick="pilihJenis('mobil')">🚗 Mobil (5rb)</button>
        </div>
        <input type="file" id="fotoInput" accept="image/*" capture="environment" class="hidden">
        <img id="previewFoto" class="preview hidden" alt="Preview">
        <div id="inputPolisiWrap" class="hidden">
          <input type="text" id="noPolisi" placeholder="Nomor Polisi (min. 8 karakter)" minlength="8" autocomplete="off">
        </div>
        <button id="btnSimpanMasuk" class="btn success" style="width:100%; margin-top:10px;" disabled onclick="simpanMasuk()">✔️ Simpan Masuk</button>
      </div>

      <!-- Kendaraan Keluar -->
      <div class="card keluar-card">
        <h3>🚪 Kendaraan Keluar</h3>
        <div class="autocomplete-wrap">
          <input type="text" id="cariKeluar" placeholder="Ketik nomor polisi..." autocomplete="off" oninput="autocompleteKeluar()">
          <div id="suggestionsBox" class="suggestions hidden"></div>
        </div>
        <div id="detailKeluar" class="hidden" style="margin-top:10px;">
          <p><strong id="keluarPlat"></strong> (<span id="keluarJenis"></span>)</p>
          <p>Masuk: <span id="keluarWaktuMasuk"></span></p>
          <img id="keluarFoto" class="foto-besar">
          <button class="btn warning" style="margin-top:8px;" onclick="prosesKeluar()">✔️ Keluarkan</button>
        </div>
      </div>

      <!-- Daftar Hari Ini -->
      <div class="card">
        <h3>📋 Parkir Hari Ini</h3>
        <div class="table-wrap" id="daftarHariIni"></div>
      </div>
    </div>

    <!-- Halaman Admin -->
    <div id="adminSection" class="hidden">
      <div class="header" style="background:#c62828;">
        <h1>🔐 Admin Panel</h1>
        <button class="btn small" onclick="logout()">↩️ Logout</button>
      </div>

      <!-- Cek Kendaraan Parkir -->
      <div class="card">
        <h3>🔍 Cek Kendaraan Parkir</h3>
        <div class="autocomplete-wrap">
          <input type="text" id="cariParkirAdmin" placeholder="Ketik nomor polisi kendaraan parkir..." autocomplete="off" oninput="autocompleteAdminParkir()">
          <div id="suggestionsAdminParkir" class="suggestions hidden"></div>
        </div>
        <div id="detailAdminParkir" class="hidden" style="margin-top:10px;">
          <p><strong id="adminParkirPlat"></strong> (<span id="adminParkirJenis"></span>)</p>
          <p>Masuk: <span id="adminParkirWaktu"></span></p>
          <img id="adminParkirFoto" class="foto-besar">
        </div>
      </div>

      <!-- Laporan Keuangan -->
      <div class="card">
        <h3>💰 Laporan Keuangan</h3>
        <div class="flex-row" style="flex-wrap:wrap; gap:8px;">
          <select id="filterLaporan" onchange="loadLaporan()" style="flex:1; min-width:120px;">
            <option value="hariIni">Hari Ini</option>
            <option value="kemarin">Kemarin</option>
            <option value="7hari">7 Hari Terakhir</option>
            <option value="30hari">30 Hari Terakhir</option>
            <option value="bulanIni">Bulan Ini</option>
            <option value="custom">Custom</option>
          </select>
          <input type="date" id="tglMulai" class="hidden" style="flex:1; min-width:120px;">
          <input type="date" id="tglSelesai" class="hidden" style="flex:1; min-width:120px;">
        </div>
        <div class="ringkasan" id="ringkasanLaporan" style="margin-top:10px;"></div>
        <div class="table-wrap" id="detailLaporan" style="margin-top:10px;"></div>
      </div>

      <!-- Riwayat Kendaraan -->
      <div class="card">
        <h3>📜 Riwayat Kendaraan</h3>
        <div class="flex-row" style="margin-bottom:10px;">
          <input type="date" id="filterTanggal" onchange="loadRiwayatAdmin()" style="flex:1;">
          <div class="autocomplete-wrap" style="flex:2;">
            <input type="text" id="filterNoPolisi" placeholder="Cari no polisi..." autocomplete="off" oninput="autocompleteNoPolisi()">
            <div id="suggestionsNoPolisi" class="suggestions hidden"></div>
          </div>
        </div>
        <div class="table-wrap" id="riwayatAdmin"></div>
      </div>

      <!-- Ubah Password -->
      <div class="card">
        <h3>🔑 Ubah Password Petugas</h3>
        <div class="flex-row">
          <input type="password" id="newPetugasPass" placeholder="Password baru" style="flex:2;">
          <button class="btn primary" onclick="ubahPasswordPetugas()">Simpan</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyCSJ5Jj_vBTjwsPFbGte6anXBoz7pJTtUQ",
      authDomain: "parkir-tb.firebaseapp.com",
      databaseURL: "https://parkir-tb-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "parkir-tb",
      storageBucket: "parkir-tb.firebasestorage.app",
      messagingSenderId: "815582557231",
      appId: "1:815582557231:web:c2f43956612cef85cd82da"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Cloudinary config
    const CLOUD_NAME = 'dxque2xvu';
    const UPLOAD_PRESET = 'parkir_tb_preset';
    const API_KEY = '275854795451865';
    const CLOUDINARY_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;

    // State
    let jenisKendaraan = 'motor';
    let passwordPetugas = '12345';
    let passwordAdmin = '05092015';
    let currentKeluarKey = null;
    let daftarParkir = {};
    let currentAdminParkirKey = null;

    const loginSection = document.getElementById('loginSection');
    const petugasSection = document.getElementById('petugasSection');
    const adminSection = document.getElementById('adminSection');
    const btnMotor = document.getElementById('btnMotor');
    const btnMobil = document.getElementById('btnMobil');
    const previewFoto = document.getElementById('previewFoto');
    const suggestionsBox = document.getElementById('suggestionsBox');
    const detailKeluar = document.getElementById('detailKeluar');
    const inputPolisiWrap = document.getElementById('inputPolisiWrap');
    const noPolisiInput = document.getElementById('noPolisi');
    const btnSimpanMasuk = document.getElementById('btnSimpanMasuk');
    const fotoInput = document.getElementById('fotoInput');

    // ============ KOMPRESI FOTO (target 200KB) ============
    function kompresFoto(file, maxKB = 200) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const maxDim = 1200;
            if (width > maxDim || height > maxDim) {
              const ratio = Math.min(maxDim / width, maxDim / height);
              width = Math.round(width * ratio);
              height = Math.round(height * ratio);
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            let quality = 0.8;
            const tryCompress = (q) => {
              canvas.toBlob((blob) => {
                if (blob.size <= maxKB * 1024 || q <= 0.2) {
                  resolve(new File([blob], file.name, { type: 'image/jpeg' }));
                } else {
                  tryCompress(q - 0.1);
                }
              }, 'image/jpeg', q);
            };
            tryCompress(quality);
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    }

    // ============ INISIALISASI ============
    async function init() {
      const snap = await db.ref('/config').once('value');
      const config = snap.val() || {};
      if (!config.petugasPassword) {
        await db.ref('/config/petugasPassword').set('12345');
        passwordPetugas = '12345';
      } else {
        passwordPetugas = config.petugasPassword;
      }
      if (!config.adminPassword) {
        await db.ref('/config/adminPassword').set('05092015');
        passwordAdmin = '05092015';
      } else {
        passwordAdmin = config.adminPassword;
      }
      loginSection.classList.remove('hidden');
      petugasSection.classList.add('hidden');
      adminSection.classList.add('hidden');
    }

    // ============ LOGIN ============
    window.loginPetugas = async function() {
      const input = document.getElementById('passwordPetugas').value;
      const error = document.getElementById('loginError');
      if (input === passwordPetugas) {
        loginSection.classList.add('hidden');
        petugasSection.classList.remove('hidden');
        adminSection.classList.add('hidden');
        pilihJenis('motor');
        resetFormMasuk();
        loadDaftarParkir();
        error.textContent = '';
      } else {
        error.textContent = 'Password petugas salah!';
      }
    };

    window.loginAdmin = async function() {
      const input = document.getElementById('passwordAdminInput').value;
      const error = document.getElementById('adminLoginError');
      if (input === passwordAdmin) {
        loginSection.classList.add('hidden');
        petugasSection.classList.add('hidden');
        adminSection.classList.remove('hidden');
        loadLaporan();
        loadRiwayatAdmin();
        error.textContent = '';
      } else {
        error.textContent = 'Password admin salah!';
      }
    };

    window.logout = function() {
      loginSection.classList.remove('hidden');
      petugasSection.classList.add('hidden');
      adminSection.classList.add('hidden');
      document.getElementById('passwordPetugas').value = '';
      document.getElementById('passwordAdminInput').value = '';
      document.getElementById('loginError').textContent = '';
      document.getElementById('adminLoginError').textContent = '';
      resetFormMasuk();
    };

    function resetFormMasuk() {
      noPolisiInput.value = '';
      fotoInput.value = '';
      previewFoto.classList.add('hidden');
      inputPolisiWrap.classList.add('hidden');
      btnSimpanMasuk.disabled = true;
      detailKeluar.classList.add('hidden');
      suggestionsBox.classList.add('hidden');
      document.getElementById('cariKeluar').value = '';
      currentKeluarKey = null;
    }

    // ============ PILIH JENIS & BUKA KAMERA ============
    window.pilihJenis = function(jenis) {
      jenisKendaraan = jenis;
      btnMotor.style.background = jenis === 'motor' ? '#1a73e8' : '#e0e0e0';
      btnMotor.style.color = jenis === 'motor' ? 'white' : '#333';
      btnMobil.style.background = jenis === 'mobil' ? '#1a73e8' : '#e0e0e0';
      btnMobil.style.color = jenis === 'mobil' ? 'white' : '#333';
      // Buka kamera
      fotoInput.click();
    };

    // ============ HANDLE FOTO ============
    fotoInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          previewFoto.src = ev.target.result;
          previewFoto.classList.remove('hidden');
          inputPolisiWrap.classList.remove('hidden');
          noPolisiInput.value = '';
          btnSimpanMasuk.disabled = true;
        };
        reader.readAsDataURL(file);
      }
    });

    noPolisiInput.addEventListener('input', function() {
      btnSimpanMasuk.disabled = (noPolisiInput.value.trim().length < 8 || !fotoInput.files[0]);
    });

    // ============ SIMPAN MASUK ============
    window.simpanMasuk = async function() {
      const noPol = noPolisiInput.value.trim();
      if (noPol.length < 8) {
        alert('Nomor polisi minimal 8 karakter!');
        return;
      }
      if (!fotoInput.files || !fotoInput.files[0]) {
        alert('Harap ambil foto kendaraan!');
        return;
      }
      btnSimpanMasuk.disabled = true;
      btnSimpanMasuk.textContent = '⏳ Kompresi...';
      try {
        const compressed = await kompresFoto(fotoInput.files[0], 200);
        btnSimpanMasuk.textContent = '⏳ Upload...';
        const formData = new FormData();
        formData.append('file', compressed);
        formData.append('upload_preset', UPLOAD_PRESET);
        formData.append('api_key', API_KEY);
        const res = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
        const data = await res.json();
        if (!data.secure_url) throw new Error('Upload gagal');
        const fotoUrl = data.secure_url;

        const newRef = db.ref('/kendaraan').push();
        const waktuMasuk = Date.now();
        await newRef.set({
          noPolisi: noPol.toUpperCase(),
          jenis: jenisKendaraan,
          waktuMasuk: waktuMasuk,
          fotoMasuk: fotoUrl,
          status: 'masuk',
          waktuKeluar: null
        });

        resetFormMasuk();
        loadDaftarParkir();
        alert('✅ Kendaraan tercatat!');
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        btnSimpanMasuk.disabled = false;
        btnSimpanMasuk.textContent = '✔️ Simpan Masuk';
      }
    };

    // ============ DAFTAR PARKIR ============
    function loadDaftarParkir() {
      db.ref('/kendaraan').orderByChild('status').equalTo('masuk').on('value', snap => {
        daftarParkir = snap.val() || {};
        tampilkanDaftarHariIni();
      });
      db.ref('/kendaraan').orderByChild('waktuMasuk').on('value', snap => {
        tampilkanDaftarHariIni(snap.val());
      });
    }

    function tampilkanDaftarHariIni(data) {
      if (!data) data = daftarParkir;
      const hariIni = new Date().toDateString();
      const container = document.getElementById('daftarHariIni');
      const entries = Object.entries(data || {}).filter(([k, v]) => new Date(v.waktuMasuk).toDateString() === hariIni)
        .sort((a, b) => b[1].waktuMasuk - a[1].waktuMasuk);
      if (entries.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#888;">Belum ada kendaraan hari ini</p>';
        return;
      }
      let html = '<table><tr><th>No Pol</th><th>Jns</th><th>Masuk</th><th>Sts</th><th>Foto</th></tr>';
      entries.forEach(([key, val]) => {
        const w = new Date(val.waktuMasuk).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        const sts = val.status === 'masuk' ? '🟢' : '🔴';
        html += `<tr>
          <td>${val.noPolisi}</td><td>${val.jenis}</td><td>${w}</td><td>${sts}</td>
          <td><img src="${val.fotoMasuk}" class="thumbnail" onclick="window.open('${val.fotoMasuk}')"></td>
        </tr>`;
      });
      html += '</table>';
      container.innerHTML = html;
    }

    // ============ AUTOCOMPLETE KELUAR ============
    window.autocompleteKeluar = function() {
      const input = document.getElementById('cariKeluar').value.trim().toUpperCase();
      const box = suggestionsBox;
      if (input.length === 0) { box.classList.add('hidden'); return; }
      const matches = Object.entries(daftarParkir).filter(([k, v]) => v.noPolisi.includes(input));
      if (matches.length === 0) { box.classList.add('hidden'); return; }
      box.innerHTML = matches.map(([k, v]) => `<div onclick="pilihKendaraanKeluar('${k}')">${v.noPolisi} (${v.jenis})</div>`).join('');
      box.classList.remove('hidden');
    };

    window.pilihKendaraanKeluar = function(key) {
      const val = daftarParkir[key];
      document.getElementById('cariKeluar').value = val.noPolisi;
      suggestionsBox.classList.add('hidden');
      detailKeluar.classList.remove('hidden');
      document.getElementById('keluarPlat').textContent = val.noPolisi;
      document.getElementById('keluarJenis').textContent = val.jenis;
      document.getElementById('keluarWaktuMasuk').textContent = new Date(val.waktuMasuk).toLocaleString('id-ID');
      document.getElementById('keluarFoto').src = val.fotoMasuk;
      currentKeluarKey = key;
    };

    window.prosesKeluar = async function() {
      if (!currentKeluarKey) return;
      if (!confirm('Keluarkan kendaraan ini?')) return;
      await db.ref(`/kendaraan/${currentKeluarKey}`).update({ status: 'keluar', waktuKeluar: Date.now() });
      detailKeluar.classList.add('hidden');
      document.getElementById('cariKeluar').value = '';
      currentKeluarKey = null;
      loadDaftarParkir();
    };

    // ============ LAPORAN KEUANGAN (ADMIN) ============
    document.getElementById('filterLaporan').addEventListener('change', function() {
      const custom = this.value === 'custom';
      document.getElementById('tglMulai').classList.toggle('hidden', !custom);
      document.getElementById('tglSelesai').classList.toggle('hidden', !custom);
      if (!custom) loadLaporan();
    });
    document.getElementById('tglMulai').addEventListener('change', loadLaporan);
    document.getElementById('tglSelesai').addEventListener('change', loadLaporan);

    async function loadLaporan() {
      const filter = document.getElementById('filterLaporan').value;
      let start, end, label;
      const now = new Date();
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      const todayEnd = todayStart + 86400000 - 1;
      switch (filter) {
        case 'hariIni': start = todayStart; end = todayEnd; label = 'Hari Ini'; break;
        case 'kemarin': start = todayStart - 86400000; end = todayEnd - 86400000; label = 'Kemarin'; break;
        case '7hari': start = todayStart - 6 * 86400000; end = todayEnd; label = '7 Hari Terakhir'; break;
        case '30hari': start = todayStart - 29 * 86400000; end = todayEnd; label = '30 Hari Terakhir'; break;
        case 'bulanIni': start = new Date(now.getFullYear(), now.getMonth(), 1).getTime(); end = todayEnd; label = 'Bulan Ini'; break;
        case 'custom':
          const tglMulai = document.getElementById('tglMulai').value;
          const tglSelesai = document.getElementById('tglSelesai').value;
          if (!tglMulai || !tglSelesai) { document.getElementById('ringkasanLaporan').innerHTML = 'Pilih rentang tanggal.'; return; }
          start = new Date(tglMulai).getTime();
          end = new Date(tglSelesai).getTime() + 86400000 - 1;
          label = `${tglMulai} s/d ${tglSelesai}`;
          break;
      }
      const snap = await db.ref('/kendaraan').once('value');
      const data = snap.val() || {};
      let mobil = 0, motor = 0, total = 0;
      const detailRows = [];
      Object.entries(data).filter(([k, v]) => v.waktuMasuk >= start && v.waktuMasuk <= end).forEach(([k, v]) => {
        if (v.jenis === 'mobil') mobil++;
        else motor++;
        total += v.jenis === 'mobil' ? 5000 : 2000;
        detailRows.push({ ...v, key: k });
      });
      document.getElementById('ringkasanLaporan').innerHTML = `
        <b>Periode: ${label}</b><br>
        🚗 Mobil: <b>${mobil}</b> x Rp5.000 = Rp${mobil * 5000}<br>
        🏍️ Motor: <b>${motor}</b> x Rp2.000 = Rp${motor * 2000}<br>
        💰 <b>Total Pemasukan: Rp${total.toLocaleString('id-ID')}</b>
      `;
      if (detailRows.length === 0) {
        document.getElementById('detailLaporan').innerHTML = '<p style="color:#888;">Tidak ada transaksi</p>';
        return;
      }
      let html = '<table><tr><th>No Pol</th><th>Jns</th><th>Masuk</th><th>Keluar</th><th>Tarif</th><th>Foto</th></tr>';
      detailRows.sort((a, b) => b.waktuMasuk - a.waktuMasuk).forEach(v => {
        const msuk = new Date(v.waktuMasuk).toLocaleString('id-ID', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });
        const klr = v.waktuKeluar ? new Date(v.waktuKeluar).toLocaleString('id-ID', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' }) : '-';
        html += `<tr>
          <td>${v.noPolisi}</td><td>${v.jenis}</td><td>${msuk}</td><td>${klr}</td>
          <td>Rp${v.jenis==='mobil'?5000:2000}</td>
          <td><img src="${v.fotoMasuk}" class="thumbnail" onclick="window.open('${v.fotoMasuk}')"></td>
        </tr>`;
      });
      html += '</table>';
      document.getElementById('detailLaporan').innerHTML = html;
    }

    // ============ RIWAYAT ADMIN (dengan filter noPolisi) ============
    async function loadRiwayatAdmin(filterNo = null) {
      const tgl = document.getElementById('filterTanggal').value;
      const noPolFilter = filterNo || document.getElementById('filterNoPolisi').value.trim().toUpperCase();
      const snap = await db.ref('/kendaraan').once('value');
      const data = snap.val() || {};
      let entries = Object.entries(data).sort((a, b) => b[1].waktuMasuk - a[1].waktuMasuk);
      if (tgl) {
        const filterDate = new Date(tgl).toLocaleDateString('id-ID');
        entries = entries.filter(([k, v]) => new Date(v.waktuMasuk).toLocaleDateString('id-ID') === filterDate);
      }
      if (noPolFilter) {
        entries = entries.filter(([k, v]) => v.noPolisi.includes(noPolFilter));
      }
      const container = document.getElementById('riwayatAdmin');
      if (entries.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#888;">Tidak ada data</p>';
        return;
      }
      let html = '<table><tr><th>Aksi</th><th>No Pol</th><th>Jns</th><th>Masuk</th><th>Keluar</th><th>Sts</th><th>Foto</th></tr>';
      entries.forEach(([key, val]) => {
        const msuk = new Date(val.waktuMasuk).toLocaleString('id-ID', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });
        const klr = val.waktuKeluar ? new Date(val.waktuKeluar).toLocaleString('id-ID', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' }) : '-';
        const sts = val.status === 'masuk' ? '🟢' : '🔴';
        html += `<tr>
          <td style="white-space:nowrap;">
            <button class="btn small warning" onclick="editKendaraan('${key}')">Edit</button>
            <button class="btn small danger" onclick="hapusKendaraan('${key}')">Hapus</button>
          </td>
          <td>${val.noPolisi}</td><td>${val.jenis}</td><td>${msuk}</td><td>${klr}</td><td>${sts}</td>
          <td><img src="${val.fotoMasuk}" class="thumbnail" onclick="window.open('${val.fotoMasuk}')"></td>
        </tr>`;
      });
      html += '</table>';
      container.innerHTML = html;
    }

    // ============ AUTOCOMPLETE NO POLISI UNTUK RIWAYAT ============
    window.autocompleteNoPolisi = async function() {
      const input = document.getElementById('filterNoPolisi').value.trim().toUpperCase();
      const box = document.getElementById('suggestionsNoPolisi');
      if (input.length === 0) { box.classList.add('hidden'); return; }
      const snap = await db.ref('/kendaraan').once('value');
      const data = snap.val() || {};
      const noPolUnik = [...new Set(Object.values(data).map(v => v.noPolisi))].filter(np => np.includes(input));
      if (noPolUnik.length === 0) { box.classList.add('hidden'); return; }
      box.innerHTML = noPolUnik.map(np => `<div onclick="pilihNoPolisi('${np}')">${np}</div>`).join('');
      box.classList.remove('hidden');
    };

    window.pilihNoPolisi = function(np) {
      document.getElementById('filterNoPolisi').value = np;
      document.getElementById('suggestionsNoPolisi').classList.add('hidden');
      loadRiwayatAdmin(np);
    };

    // ============ AUTOCOMPLETE CEK PARKIR (ADMIN) ============
    window.autocompleteAdminParkir = async function() {
      const input = document.getElementById('cariParkirAdmin').value.trim().toUpperCase();
      const box = document.getElementById('suggestionsAdminParkir');
      if (input.length === 0) { box.classList.add('hidden'); return; }
      const snap = await db.ref('/kendaraan').orderByChild('status').equalTo('masuk').once('value');
      const dataParkir = snap.val() || {};
      const matches = Object.entries(dataParkir).filter(([k, v]) => v.noPolisi.includes(input));
      if (matches.length === 0) { box.classList.add('hidden'); return; }
      box.innerHTML = matches.map(([k, v]) => `<div onclick="pilihAdminParkir('${k}')">${v.noPolisi} (${v.jenis})</div>`).join('');
      box.classList.remove('hidden');
    };

    window.pilihAdminParkir = function(key) {
      const val = daftarParkir[key] || {}; // gunakan cache jika ada
      // ambil dari snapshot
      db.ref(`/kendaraan/${key}`).once('value').then(snap => {
        const data = snap.val();
        if (!data) return;
        document.getElementById('cariParkirAdmin').value = data.noPolisi;
        document.getElementById('suggestionsAdminParkir').classList.add('hidden');
        document.getElementById('detailAdminParkir').classList.remove('hidden');
        document.getElementById('adminParkirPlat').textContent = data.noPolisi;
        document.getElementById('adminParkirJenis').textContent = data.jenis;
        document.getElementById('adminParkirWaktu').textContent = new Date(data.waktuMasuk).toLocaleString('id-ID');
        document.getElementById('adminParkirFoto').src = data.fotoMasuk;
        currentAdminParkirKey = key;
      });
    };

    window.editKendaraan = async function(key) {
      const snap = await db.ref(`/kendaraan/${key}`).once('value');
      const data = snap.val();
      const noBaru = prompt('Edit nomor polisi:', data.noPolisi);
      if (noBaru !== null && noBaru.trim().length >= 8) {
        await db.ref(`/kendaraan/${key}`).update({ noPolisi: noBaru.trim().toUpperCase() });
        loadRiwayatAdmin();
        loadLaporan();
      }
    };

    window.hapusKendaraan = async function(key) {
      if (confirm('Hapus permanen data ini?')) {
        await db.ref(`/kendaraan/${key}`).remove();
        loadRiwayatAdmin();
        loadLaporan();
      }
    };

    window.ubahPasswordPetugas = async function() {
      const newPass = document.getElementById('newPetugasPass').value.trim();
      if (newPass.length < 4) { alert('Password minimal 4 karakter'); return; }
      await db.ref('/config/petugasPassword').set(newPass);
      passwordPetugas = newPass;
      alert('Password petugas berhasil diubah');
      document.getElementById('newPetugasPass').value = '';
    };

    document.addEventListener('click', function(e) {
      if (!e.target.closest('#cariKeluar') && !e.target.closest('#suggestionsBox')) {
        suggestionsBox.classList.add('hidden');
      }
      if (!e.target.closest('#filterNoPolisi') && !e.target.closest('#suggestionsNoPolisi')) {
        document.getElementById('suggestionsNoPolisi').classList.add('hidden');
      }
      if (!e.target.closest('#cariParkirAdmin') && !e.target.closest('#suggestionsAdminParkir')) {
        document.getElementById('suggestionsAdminParkir').classList.add('hidden');
      }
    });

    init();
  </script>
</body>
</html>
